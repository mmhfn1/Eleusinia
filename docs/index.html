<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Eleusinia</title>
<meta name="description" content="Eleusinia: chat and voice calls that go straight to your friends, with no server in between. Download for Windows, macOS and Linux.">
<link rel="icon" href="emblem.png">
<style>
  /* Fonts ship with the page, so visiting it contacts nobody but GitHub. */
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
    font-weight: 200 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'Instrument Sans';
    src: url('fonts/instrument-sans-latin-wght-normal.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }

  /* Light mode, sampled from the Shattered Throne art: the fog's cyan-grey haze as the ground,
     its navy body as ink, and stone for everything secondary. */
  :root {
    --paper: #f4f5f6;   /* the near-white peaks */
    --haze: #c8d6d3;    /* the haze */
    --fog: #dfe7ea;     /* the haze, thinned */
    --stone: #425a6b;   /* fog and stone */
    --ink: #010d25;     /* the navy body of every frame */
    --line: rgb(66 90 107 / 0.22);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100%;
    padding: 48px 16px;
    background:
      radial-gradient(70% 45% at 50% 0%, var(--haze), transparent 70%),
      linear-gradient(180deg, var(--fog), var(--paper) 60%);
    color: var(--ink);
    font: 16px/1.55 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: min(420px, 100%);
    display: grid;
    justify-items: center;
    gap: 16px;
    text-align: center;
  }
  .emblem {
    width: 96px;
    height: 96px;
    background: var(--ink);
    -webkit-mask: url('emblem.png') center / contain no-repeat;
    mask: url('emblem.png') center / contain no-repeat;
  }
  h1 {
    margin: 4px 0 0;
    font: 700 40px/1.1 'Bricolage Grotesque', 'Segoe UI', sans-serif;
    letter-spacing: -0.01em;
  }
  .lede {
    margin: 0;
    max-width: 34ch;
    color: var(--stone);
  }
  .download {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin-top: 12px;
    padding: 14px 32px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    transition: transform 160ms ease, box-shadow 200ms ease;
  }
  .download:hover { box-shadow: 0 10px 28px -12px rgb(1 13 37 / 0.55); transform: translateY(-1px); }
  .download:active { transform: translateY(0); }
  .download:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .download small { font-weight: 400; font-size: 13px; opacity: 0.75; }
  .meta {
    margin: 0;
    color: var(--stone);
    font-size: 14px;
  }
  .meta a { color: var(--ink); }
  .others {
    margin: 0;
    color: var(--stone);
    font-size: 14px;
  }
  .others a { color: var(--ink); white-space: nowrap; }
  .note {
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--stone);
    font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) { .download { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="emblem" aria-hidden="true"></div>
  <h1>Eleusinia</h1>
  <p class="lede">Chat and voice calls that go straight to your friends, with no server in between.</p>
  <a class="download" id="download" href="https://github.com/mmhfn1/Eleusinia/releases/latest">
    <span id="label">Download Eleusinia</span>
    <small id="version">Latest version</small>
  </a>
  <p class="meta" id="needs">Windows, macOS and Linux · <a href="https://github.com/mmhfn1/Eleusinia/releases">All releases</a></p>
  <p class="others" id="others"></p>
  <p class="note" id="note">Eleusinia updates itself after you install it.</p>
</main>
<script>
  // One button for the visitor's system, links for the rest. Browsers say "Intel" on every Mac, so Apple Silicon (most
  // Macs today) is offered first, with Intel beside it. Without GitHub the button still opens the latest release page.
  const SYSTEMS = {
    windows: {
      name: 'Windows',
      file: /^Eleusinia-Setup-.*\.exe$/,
      needs: 'Windows 10 or 11, 64-bit',
      note: 'The installer is not code-signed yet, so Windows may warn you. Choose More info, then Run anyway. Eleusinia updates itself after that.',
    },
    mac: {
      name: 'macOS (Apple Silicon)',
      file: /-arm64\.dmg$/,
      needs: 'macOS 11 or later, Apple Silicon (M1 and newer)',
      note: 'Open the download and drag Eleusinia into Applications. It is not from the App Store, so the first time macOS stops it: right-click Eleusinia, choose Open, then Open again (on macOS 15 and later, open it once, then choose Open Anyway in System Settings → Privacy & Security). Eleusinia updates itself after that.',
    },
    macIntel: {
      name: 'macOS (Intel)',
      file: /-x64\.dmg$/,
      needs: 'macOS 11 or later, Intel',
      note: 'Open the download and drag Eleusinia into Applications. It is not from the App Store, so the first time macOS stops it: right-click Eleusinia, choose Open, then Open again (on macOS 15 and later, open it once, then choose Open Anyway in System Settings → Privacy & Security). Eleusinia updates itself after that.',
    },
    linux: {
      name: 'Linux',
      file: /\.AppImage$/,
      needs: 'Linux, 64-bit (an AppImage: runs on most distributions)',
      note: 'Make the file executable (right-click → Properties → Allow executing as a program, or chmod +x), then open it. Keep it where you can write to, so it can update itself. Hotkeys need X11 rather than Wayland.',
    },
  }
  const ua = navigator.userAgent
  const mine = /Windows/.test(ua) ? 'windows' : /Mac OS X|Macintosh/.test(ua) ? 'mac' : /Linux|X11/.test(ua) && !/Android/.test(ua) ? 'linux' : 'windows'

  function show(key, rel) {
    const s = SYSTEMS[key]
    const asset = rel?.assets.find((a) => s.file.test(a.name))
    document.getElementById('label').textContent = `Download for ${s.name}`
    document.getElementById('needs').firstChild.textContent = `${s.needs} · `
    document.getElementById('note').textContent = s.note
    // No file for this system in the latest release (or GitHub unreachable): its release page, never another system's file
    document.getElementById('download').href = asset ? asset.browser_download_url : 'https://github.com/mmhfn1/Eleusinia/releases/latest'
    document.getElementById('version').textContent = asset ? `Version ${rel.tag_name.replace(/^v/, '')}, ${Math.round(asset.size / 2 ** 20)} MB` : 'Latest version'
    const others = document.getElementById('others')
    const rest = Object.keys(SYSTEMS).filter((k) => k !== key && (!rel || rel.assets.some((a) => SYSTEMS[k].file.test(a.name))))
    others.textContent = rest.length ? 'Other systems: ' : ''
    rest.forEach((k, i) => {
      if (i) others.append(' · ')
      const a = document.createElement('a')
      a.href = '#'
      a.textContent = SYSTEMS[k].name
      a.onclick = (e) => (e.preventDefault(), show(k, rel))
      others.append(a)
    })
  }
  show(mine, null)
  fetch('https://api.github.com/repos/mmhfn1/Eleusinia/releases/latest')
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((rel) => show(mine, rel))
    .catch(() => {})
</script>
</body>
</html>
