<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050608">
<title>Download Eleusinia</title>
<meta name="description" content="Eleusinia: chat and voice calls that go straight to your friends, with no server in between. Download for Windows, macOS and Linux.">
<link rel="icon" href="emblem.png">
<style>
  /* Fonts ship with the page, so visiting it contacts nobody but GitHub. */
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
    font-weight: 200 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'Instrument Sans';
    src: url('fonts/instrument-sans-latin-wght-normal.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }

  /* The app's room (src/renderer/style.css, splash.css): the void, cold fog from above, a lamp's warm light below.
     Three moods drift through it, fog, ember and veil (the app's --fog, --ember, --violet), each a layer that only
     fades and moves, the cheapest work for the graphics card. */
  :root {
    --void: #050608;
    --silver: #f5f3ef;
    --mist: #b9b5ad;
    --ember: #d8c39c;
    --word: #e6d6b4;
    --line: #36312a;
    --breath: 2.6s;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100%;
    padding: 48px 16px;
    overflow-x: hidden;
    background: var(--void);
    color: var(--silver);
    font: 16px/1.55 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .room { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .mood {
    position: absolute;
    width: 90vmax;
    height: 90vmax;
    border-radius: 50%;
    opacity: 0;
    will-change: opacity, transform;
    animation: mood 24s ease-in-out infinite, drift 18s ease-in-out infinite alternate;
  }
  .fog { left: -20vmax; top: -45vmax; background: radial-gradient(closest-side, rgb(66 90 107 / 0.8), transparent); }
  .ember { right: -30vmax; bottom: -55vmax; background: radial-gradient(closest-side, rgb(216 195 156 / 0.38), transparent); animation-delay: -8s, -8s; }
  .veil { left: -35vmax; bottom: -40vmax; background: radial-gradient(closest-side, rgb(169 152 214 / 0.36), transparent); animation-delay: -16s, -16s; }
  /* the app's own fog and lamp, always there under the moods */
  .room::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(90% 60% at 50% -10%, rgb(66 90 107 / 0.3), transparent 62%),
      radial-gradient(70% 45% at 50% 118%, rgb(216 195 156 / 0.1), transparent 72%);
  }
  @keyframes mood { 0%, 100% { opacity: 0.25; } 33% { opacity: 1; } 66% { opacity: 0.4; } }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(14vmax, 10vmax) scale(1.2); } }

  main {
    width: min(420px, 100%);
    display: grid;
    justify-items: center;
    gap: 16px;
    text-align: center;
  }
  /* The splash's lantern: a warm lamp breathing inside the emblem */
  .emblem {
    position: relative;
    width: 112px;
    height: 112px;
    -webkit-mask: url('emblem.png') center / contain no-repeat;
    mask: url('emblem.png') center / contain no-repeat;
    background: radial-gradient(circle at 50% 56%, #6b5a4c, #2a2320 55%, var(--void));
  }
  .emblem::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 56%, #eadedc 0%, #d8c39c 32%, #8c6f4e 62%, #2a2320 92%);
    will-change: opacity;
    animation: lamp var(--breath) ease-in-out infinite alternate;
  }
  @keyframes lamp { from { opacity: 0.55; } to { opacity: 1; } }
  /* The wordmark, as in the app */
  h1 {
    margin: 8px 0 0;
    padding-left: 0.42em;
    font: 600 22px/1.1 'Bricolage Grotesque', 'Segoe UI', sans-serif;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--word);
  }
  .lede {
    margin: 0;
    max-width: 34ch;
    color: var(--mist);
  }
  .download {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin-top: 12px;
    padding: 14px 32px;
    border-radius: 999px;
    background: var(--silver);
    color: var(--void);
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    transition: transform 160ms ease, box-shadow 200ms ease;
  }
  .download:hover { box-shadow: 0 0 0 1px rgb(216 195 156 / 0.5), 0 12px 36px -10px rgb(216 195 156 / 0.45); transform: translateY(-1px); }
  .download:active { transform: translateY(0); }
  .download:focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }
  .download small { font-weight: 400; font-size: 13px; opacity: 0.7; }
  .meta, .others {
    margin: 0;
    color: var(--mist);
    font-size: 14px;
  }
  .meta a, .others a { color: var(--silver); text-decoration-color: rgb(216 195 156 / 0.5); }
  .meta a:hover, .others a:hover { color: var(--ember); }
  .others a { white-space: nowrap; }
  .note {
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--mist);
    font-size: 13px;
  }
  /* Still under reduced motion, as the splash is: the fog mood held, the lamp lit */
  @media (prefers-reduced-motion: reduce) {
    .download { transition: none; }
    .mood, .emblem::after { animation: none; }
    .fog { opacity: 1; }
    .emblem::after { opacity: 0.85; }
  }
</style>
</head>
<body>
<div class="room" aria-hidden="true"><div class="mood fog"></div><div class="mood ember"></div><div class="mood veil"></div></div>
<main>
  <div class="emblem" aria-hidden="true"></div>
  <h1>Eleusinia</h1>
  <p class="lede">Chat and voice calls that go straight to your friends, with no server in between.</p>
  <a class="download" id="download" href="https://github.com/mmhfn1/Eleusinia/releases/latest">
    <span id="label">Download Eleusinia</span>
    <small id="version">Latest version</small>
  </a>
  <p class="meta" id="needs">Windows, macOS and Linux · <a href="https://github.com/mmhfn1/Eleusinia/releases">All releases</a></p>
  <p class="others" id="others"></p>
  <p class="note" id="note">Eleusinia updates itself after you install it.</p>
</main>
<script>
  // One button for the visitor's system, links for the rest. Browsers say "Intel" on every Mac, so Apple Silicon (most
  // Macs today) is offered first, with Intel beside it. Without GitHub the button still opens the latest release page.
  const SYSTEMS = {
    windows: {
      name: 'Windows',
      file: /^Eleusinia-Setup-.*\.exe$/,
      needs: 'Windows 10 or 11, 64-bit',
      note: 'The installer is not code-signed yet, so Windows may warn you. Choose More info, then Run anyway. Eleusinia updates itself after that.',
    },
    mac: {
      name: 'macOS (Apple Silicon)',
      file: /-arm64\.dmg$/,
      needs: 'macOS 11 or later, Apple Silicon (M1 and newer)',
      note: 'Open the download and drag Eleusinia into Applications. It is not from the App Store, so the first time macOS stops it: right-click Eleusinia, choose Open, then Open again (on macOS 15 and later, open it once, then choose Open Anyway in System Settings → Privacy & Security). Eleusinia updates itself after that.',
    },
    macIntel: {
      name: 'macOS (Intel)',
      file: /-x64\.dmg$/,
      needs: 'macOS 11 or later, Intel',
      note: 'Open the download and drag Eleusinia into Applications. It is not from the App Store, so the first time macOS stops it: right-click Eleusinia, choose Open, then Open again (on macOS 15 and later, open it once, then choose Open Anyway in System Settings → Privacy & Security). Eleusinia updates itself after that.',
    },
    linux: {
      name: 'Linux',
      file: /\.AppImage$/,
      needs: 'Linux, 64-bit (an AppImage: runs on most distributions)',
      note: 'Make the file executable (right-click → Properties → Allow executing as a program, or chmod +x), then open it. Keep it where you can write to, so it can update itself. Hotkeys need X11 rather than Wayland.',
    },
  }
  const ua = navigator.userAgent
  const mine = /Windows/.test(ua) ? 'windows' : /Mac OS X|Macintosh/.test(ua) ? 'mac' : /Linux|X11/.test(ua) && !/Android/.test(ua) ? 'linux' : 'windows'

  function show(key, rel) {
    const s = SYSTEMS[key]
    const asset = rel?.assets.find((a) => s.file.test(a.name))
    document.getElementById('label').textContent = `Download for ${s.name}`
    document.getElementById('needs').firstChild.textContent = `${s.needs} · `
    document.getElementById('note').textContent = s.note
    // No file for this system in the latest release (or GitHub unreachable): its release page, never another system's file
    document.getElementById('download').href = asset ? asset.browser_download_url : 'https://github.com/mmhfn1/Eleusinia/releases/latest'
    document.getElementById('version').textContent = asset ? `Version ${rel.tag_name.replace(/^v/, '')}, ${Math.round(asset.size / 2 ** 20)} MB` : 'Latest version'
    const others = document.getElementById('others')
    const rest = Object.keys(SYSTEMS).filter((k) => k !== key && (!rel || rel.assets.some((a) => SYSTEMS[k].file.test(a.name))))
    others.textContent = rest.length ? 'Other systems: ' : ''
    rest.forEach((k, i) => {
      if (i) others.append(' · ')
      const a = document.createElement('a')
      a.href = '#'
      a.textContent = SYSTEMS[k].name
      a.onclick = (e) => (e.preventDefault(), show(k, rel))
      others.append(a)
    })
  }
  show(mine, null)
  fetch('https://api.github.com/repos/mmhfn1/Eleusinia/releases/latest')
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((rel) => show(mine, rel))
    .catch(() => {})
</script>
</body>
</html>
