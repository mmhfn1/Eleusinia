</head>
<body>
<div id="out"></div>
<script src="draw.js"></script>
<script src="screens.js"></script>
<script>
  const q = new URLSearchParams(location.search)
  document.documentElement.dataset.theme = q.get('t') === 'ivory' ? 'light' : 'dark'
  const s = q.get('s') ?? 'home'
  document.getElementById('out').innerHTML = SCREENS[s] ? SCREENS[s]() : `<p style="color:#fff">No screen ${s}</p>`
</script>
